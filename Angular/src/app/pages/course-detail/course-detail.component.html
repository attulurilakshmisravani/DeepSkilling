<div *ngIf="course; else loading">
  <h2>{{ course.name }}</h2>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits }}</p>
  <p>Status: {{ course.gradeStatus }}</p>

  <h3>Enrolled Students</h3>
  <ul>
    <li *ngFor="let student of students$ | async">{{ student.name }}</li>
  </ul>
</div>
<ng-template #loading><p>Loading course...</p></ng-template>
